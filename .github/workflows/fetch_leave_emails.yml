name: Fetch Leave Emails

on:
  schedule:
    - cron: '*/15 * * * *' # Har 15 minute baad chalega
  workflow_dispatch: # GitHub par manual 'Run workflow' ka button enable karega

jobs:
  run-poller:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Execute Script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INTAKE_URL: ${{ secrets.INTAKE_URL }}
          INTAKE_SECRET: ${{ secrets.INTAKE_SECRET }}
        run: python fetch_leave_emails.py
